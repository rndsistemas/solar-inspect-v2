<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>SOLAR INSPECT</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3ynhJbY1FQpcQ5QeQhjhRLHj2rrcM=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash">
    <img src="solar-inspect-logo.png" alt="SOLAR INSPECT" />
    <div class="loader"></div>
  </div>

  <header>
    <div class="brand">
      <img src="solar-inspect-logo.png" alt="SOLAR INSPECT" />
      <div>
        <p>Gestão de inspeção e manutenção fotovoltaica</p>
      </div>
    </div>
    <button id="locateBtn" class="secondary">📍 Minha localização</button>
  </header>

  <main>
    <section class="toolbar">
      <select id="statusFilter" aria-label="Filtrar por status">
        <option value="todos">Todos os módulos</option>
        <option value="nao_inspecionado">Não inspecionados</option>
        <option value="normal">Normal</option>
        <option value="leve">Defeito leve</option>
        <option value="medio">Defeito médio</option>
        <option value="critico">Crítico</option>
        <option value="concluido">Manutenção concluída</option>
      </select>

      <input id="searchInput" type="search" placeholder="Buscar bloco, mesa ou módulo" />
      <button id="exportBtn">Exportar CSV</button>
      <button id="resetBtn" class="danger">Restaurar demonstração</button>
    </section>

    <section class="layout">
      <div id="map" aria-label="Mapa do complexo solar"></div>

      <aside id="sidebar">
        <div id="emptyState" class="empty-state">
          <h2>Selecione um módulo</h2>
          <p>Toque em um módulo no mapa para visualizar ou registrar uma inspeção.</p>
        </div>

        <div id="modulePanel" class="hidden">
          <div class="panel-heading">
            <div>
              <small id="moduleLocation"></small>
              <h2 id="moduleTitle"></h2>
            </div>
            <span id="statusBadge" class="badge"></span>
          </div>

          <div class="module-meta">
            <div><strong>Parque:</strong> <span id="parkName"></span></div>
            <div><strong>Bloco:</strong> <span id="blockName"></span></div>
            <div><strong>Mesa:</strong> <span id="tableName"></span></div>
            <div><strong>String:</strong> <span id="stringName"></span></div>
            <div><strong>Coordenadas:</strong> <span id="coordinates"></span></div>
          </div>

          <form id="inspectionForm">
            <label>
              Estado do módulo
              <select id="inspectionStatus" required>
                <option value="normal">Normal</option>
                <option value="leve">Defeito leve</option>
                <option value="medio">Defeito médio</option>
                <option value="critico">Crítico</option>
                <option value="concluido">Manutenção concluída</option>
              </select>
            </label>

            <label>
              Tipo de ocorrência
              <select id="defectType">
                <option value="Sem defeito">Sem defeito</option>
                <option value="Módulo quebrado">Módulo quebrado</option>
                <option value="Vidro trincado">Vidro trincado</option>
                <option value="Microtrinca">Microtrinca</option>
                <option value="Hotspot">Hotspot</option>
                <option value="Delaminação">Delaminação</option>
                <option value="Sujidade excessiva">Sujidade excessiva</option>
                <option value="Módulo solto">Módulo solto</option>
                <option value="Cabo danificado">Cabo danificado</option>
                <option value="Conector danificado">Conector danificado</option>
                <option value="Baixa geração">Baixa geração</option>
                <option value="Outro">Outro</option>
              </select>
            </label>

            <label>
              Responsável
              <input id="inspectorName" type="text" placeholder="Nome do inspetor" required />
            </label>

            <label>
              Observações
              <textarea id="notes" rows="4" placeholder="Descreva o estado do módulo e a ação recomendada"></textarea>
            </label>

            <label class="file-label">
              Fotografias
              <input id="photoInput" type="file" accept="image/*" capture="environment" multiple />
            </label>

            <div id="photoPreview" class="photo-preview"></div>

            <button type="submit" class="primary">Salvar inspeção</button>
          </form>

          <section class="history">
            <h3>Histórico</h3>
            <div id="historyList"></div>
          </section>
        </div>
      </aside>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js" defer></script>
</body>
</html>
